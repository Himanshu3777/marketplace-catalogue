<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}MarketPlace{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/">🛍️ MarketPlace</a>
  <form class="searchbar" id="search-form">
    <input id="search-input" placeholder="Search products, brands..." autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <nav>
    <a href="/">🏠 Home</a>
    <a href="/cart/" class="cart-link">🛒 Cart <span id="cart-count" class="cart-badge">0</span></a>
    <a href="/my-orders/" id="nav-orders" style="display:none">📦 Orders</a>
    <span id="auth-nav"><a href="/login/">👤 Login</a></span>
  </nav>
</header>
{% block breadcrumb %}{% endblock %}
<main>{% block content %}{% endblock %}</main>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
