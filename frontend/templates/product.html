{% extends "base.html" %}
{% block title %}Product — MarketPlace{% endblock %}
{% block content %}
<div id="detail"><div class="loading">Loading product…</div></div>
{% endblock %}
{% block scripts %}
<script>
const slug = location.pathname.split("/").filter(Boolean).pop();
let product = null, selVariant = null;

function renderVariantSelectors() {
  const axes = ["color", "size", "storage"];
  let h = "";
  axes.forEach(ax => {
    const vals = [...new Set(product.variants.map(v => v[ax]).filter(Boolean))];
    if (!vals.length) return;
    h += `<h4 style="margin:10px 0 4px;text-transform:capitalize">${ax}</h4><div class="variant-pills">`;
    vals.forEach(val => {
      const active = product.variants.some(v => v[ax] === val && v.variant_id === selVariant.variant_id);
      h += `<button data-ax="${ax}" data-val="${esc(val)}" class="${active ? "sel" : ""}">${esc(val)}</button>`;
    });
    h += `</div>`;
  });
  $("#variant-box").innerHTML = h;
  $$("#variant-box button").forEach(b => b.addEventListener("click", () => selectVariant(b.dataset.ax, b.dataset.val)));
}

function selectVariant(ax, val) {
  // keep other axes, switch this one
  const cur = { color: selVariant.color, size: selVariant.size, storage: selVariant.storage, [ax]: val };
  const match = product.variants.find(v =>
    (v.color || null) === (cur.color || null) &&
    (v.size || null) === (cur.size || null) &&
    (v.storage || null) === (cur.storage || null));
  if (match) { selVariant = match; renderAll(); }
}

function renderAll() {
  const v = selVariant;
  const img = (v.images[0]?.url) || (product.images[0]?.url) || "https://picsum.photos/seed/na/600/600";
  $("#detail").innerHTML = `
  <div class="detail">
    <div class="gallery">
      <img class="main" id="main-img" src="${img}" alt="${esc(product.name)}">
      <div class="thumbs">${(v.images.length ? v.images : product.images).map((im, i) =>
        `<img src="${im.url}" class="${i === 0 ? "sel" : ""}" data-src="${im.url}">`).join("")}</div>
    </div>
    <div>
      <div style="color:#64748b;font-size:13px">${esc(product.brand_name)} · ${esc(product.product_type)}</div>
      <h1 style="margin:6px 0">${esc(product.name)}</h1>
      <div>${stars(product.rating)} <b>${product.rating}</b> · ${product.review_count} ratings</div>
      <div style="margin:12px 0"><span class="price" style="font-size:26px">${inr(v.final_price)}</span>
        ${v.discount_pct > 0 ? `<span class="mrp">${inr(v.price)}</span><span class="off">${v.discount_pct}% off</span>` : ""}</div>
      <div style="font-size:13px;color:#64748b">Inclusive of ${product.gst_pct}% GST · Sold by ${esc(product.seller_name)}</div>
      <div id="variant-box"></div>
      <div style="margin:12px 0;font-size:14px">
        ${v.inventory.available > 0
          ? `<span style="color:#15803d;font-weight:700">✓ In stock (${v.inventory.available} available)</span>`
          : `<span style="color:#b91c1c;font-weight:700">Out of stock</span>`}
        <span style="color:#64748b"> · SKU ${esc(v.sku)}</span>
      </div>
      <div style="display:flex;gap:10px;margin:14px 0">
        <button class="btn primary" id="btn-add-cart" ${v.inventory.available > 0 ? "" : "disabled style='opacity:.5;cursor:not-allowed'"}>Add to cart</button>
        <button class="btn dark" id="btn-buy-now" ${v.inventory.available > 0 ? "" : "disabled style='opacity:.5;cursor:not-allowed'"}>Buy now</button>
      </div>
      <div style="font-size:13px;color:#64748b">🛡️ ${esc(product.warranty || "No warranty")} · ↩️ ${esc(product.return_policy || "")}</div>
    </div>
  </div>
  <div class="detail" style="margin-top:20px;grid-template-columns:1fr">
    <div>
      <h2>About this product</h2>
      <p style="margin-top:8px;color:#334155">${esc(product.detailed_description)}</p>
      <h2 style="margin-top:16px">Specifications</h2>
      <table class="spec-table">${product.specifications.map(s =>
        `<tr><td>${esc(s.name)}</td><td>${esc(s.value)}</td></tr>`).join("")}</table>
    </div>
  </div>
  <div id="reviews"></div>
  <div id="related"></div>`;
  renderVariantSelectors();
  const addBtn = $("#btn-add-cart");
  if (addBtn && !addBtn.disabled) addBtn.addEventListener("click", async () => {
    addBtn.disabled = true;
    try { await addToCart(selVariant.id, 1); addBtn.textContent = "✓ Added!"; }
    catch (e) { alert(e.message); }
    setTimeout(() => { addBtn.disabled = false; addBtn.textContent = "Add to cart"; }, 1200);
  });
  const buyBtn = $("#btn-buy-now");
  if (buyBtn && !buyBtn.disabled) buyBtn.addEventListener("click", async () => {
    try { await addToCart(selVariant.id, 1); location.href = "/checkout/"; }
    catch (e) { alert(e.message); }
  });
  $$(".thumbs img").forEach(t => t.addEventListener("click", () => {
    $("#main-img").src = t.dataset.src;
    $$(".thumbs img").forEach(x => x.classList.remove("sel")); t.classList.add("sel");
  }));
  loadReviews();
  loadRelated();
}

async function loadRelated() {
  try {
    const items = await api(`/products/${slug}/related/`);
    if (!items.length) return;
    $("#related").innerHTML = `<div class="detail" style="margin-top:20px;grid-template-columns:1fr">
      <div><h2>You may also like</h2>
      <div class="grid" style="margin-top:12px">${items.map(p => `
        <a href="/product/${p.slug}/" class="card">
          <img loading="lazy" src="${(p.images[0]?.url) || "https://picsum.photos/seed/na/400/400"}" alt="${esc(p.name)}">
          <div style="padding:10px">
            <div style="font-size:13px;color:#64748b">${esc(p.brand_name)}</div>
            <div style="font-weight:600;font-size:14px;margin:2px 0">${esc(p.name)}</div>
            <div>${stars(p.rating)} <span style="font-size:12px;color:#64748b">(${p.review_count})</span></div>
            <div style="margin-top:4px"><span class="price">${inr(p.final_price)}</span>
            ${p.discount_pct > 0 ? `<span class="mrp">${inr(p.price)}</span>` : ""}</div>
          </div>
        </a>`).join("")}</div>
      </div></div>`;
  } catch (e) { /* related is optional */ }
}

async function loadReviews() {
  const d = await api(`/products/${slug}/reviews/?page_size=5`);
  const loggedIn = await api("/accounts/me/").then(m => !!m.user).catch(() => false);
  $("#reviews").innerHTML = `<div class="detail" style="margin-top:20px;grid-template-columns:1fr">
    <div><h2>Ratings & reviews</h2>
    ${d.results.map(r => `<div class="review"><b>${stars(r.rating)}</b> <b>${esc(r.title)}</b>
      <div style="color:#64748b;font-size:13px">by ${esc(r.author_name)} ${r.is_verified ? "✓ Verified" : ""}</div>
      <p style="margin-top:4px">${esc(r.body)}</p></div>`).join("") || "<p>No reviews yet. Be the first!</p>"}
    ${loggedIn ? `
    <h3 style="margin-top:16px">Write a review</h3>
    <div style="display:flex;gap:6px;margin:8px 0" id="rev-stars">
      ${[1,2,3,4,5].map(i => `<button data-r="${i}" style="font-size:24px;background:none;border:none;cursor:pointer">☆</button>`).join("")}
    </div>
    <input id="rev-title" placeholder="Review headline" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #cbd5e1;border-radius:6px">
    <textarea id="rev-body" placeholder="What did you like or dislike?" rows="3" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px"></textarea>
    <button class="btn primary" id="rev-submit" style="margin-top:8px">Submit review</button>
    <div id="rev-msg" style="margin-top:6px;font-size:13px"></div>`
    : `<p style="margin-top:12px"><a href="/login/?next=/product/${slug}/">Log in</a> to write a review.</p>`}
    </div></div>`;
  // star picker + submit
  let picked = 5;
  $$("#rev-stars button").forEach(b => b.addEventListener("click", () => {
    picked = +b.dataset.r;
    $$("#rev-stars button").forEach(x => x.textContent = +x.dataset.r <= picked ? "★" : "☆");
  }));
  const sub = $("#rev-submit");
  if (sub) sub.addEventListener("click", async () => {
    const title = $("#rev-title").value.trim(), body = $("#rev-body").value.trim();
    if (!title || !body) { $("#rev-msg").textContent = "Please add a headline and review."; return; }
    sub.disabled = true;
    try {
      await api(`/products/${slug}/reviews/submit/`, "POST",
        { rating: picked, title, body });
      $("#rev-msg").style.color = "#15803d";
      $("#rev-msg").textContent = "Thanks! Your review is submitted.";
      loadReviews();
    } catch (e) {
      $("#rev-msg").style.color = "#b91c1c";
      $("#rev-msg").textContent = e.message;
      sub.disabled = false;
    }
  });
}

document.addEventListener("DOMContentLoaded", async () => {
  product = await api(`/products/${slug}/`);
  document.title = product.name + " — MarketPlace";
  selVariant = product.variants[0] || { final_price: product.final_price, price: product.price, discount_pct: product.discount_pct, images: [], inventory: { available: 0 }, sku: product.sku };
  renderAll();
});
</script>
{% endblock %}
