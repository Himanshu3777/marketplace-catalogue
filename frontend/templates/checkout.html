{% extends "base.html" %}
{% block title %}Checkout — MarketPlace{% endblock %}
{% block breadcrumb %}
<div class="breadcrumb">
  <a href="/">🏠 Home</a> <span>›</span>
  <a href="/cart/">🛒 Cart</a> <span>›</span>
  <a href="javascript:history.back()">← Back</a> <span>›</span>
  <span>Checkout</span>
</div>
{% endblock %}
{% block content %}
<h1 style="margin-bottom:16px">Checkout</h1>
<div id="co-wrap"><div class="loading">Loading…</div></div>
{% endblock %}
{% block scripts %}
<script>
let summary = null, payMethod = "COD";

function payOption(method, title, sub) {
  return `<div class="pay-option ${payMethod === method ? "sel" : ""}" data-pay="${method}">
    <input type="radio" name="pay" ${payMethod === method ? "checked" : ""}>
    <div><b>${title}</b><div style="font-size:13px;color:#64748b">${sub}</div></div>
  </div>`;
}

function renderCheckout(d) {
  if (!d.items.length) {
    $("#co-wrap").innerHTML = `<div class="loading">Your cart is empty.<br><br><a class="btn primary" href="/">Continue shopping</a></div>`;
    return;
  }
  summary = d;
  const fee = d.subtotal >= 499 ? 0 : 49;
  $("#co-wrap").innerHTML = `<div class="checkout-grid">
    <div class="form-card">
      <div id="co-err"></div>
      <h3>Delivery details</h3>
      <div class="form-2col">
        <div><label>Full name *</label><input id="f-name" placeholder="e.g. Himanshu yadav"></div>
        <div><label>Phone *</label><input id="f-phone" placeholder="10-digit mobile number"></div>
      </div>
      <label>Email (optional)</label><input id="f-email" placeholder="you@example.com">
      <label>Address *</label><input id="f-addr1" placeholder="House no, street, area">
      <label>Address line 2 (optional)</label><input id="f-addr2" placeholder="Landmark">
      <div class="form-2col">
        <div><label>City *</label><input id="f-city"></div>
        <div><label>State *</label><input id="f-state"></div>
      </div>
      <div class="form-2col">
        <div><label>Pincode *</label><input id="f-pin" placeholder="6-digit pincode"></div>
        <div><label>Order notes (optional)</label><input id="f-notes"></div>
      </div>
      <h3 style="margin-top:18px">Payment method</h3>
      <div id="pay-box">
        ${payOption("COD", "💵 Cash on Delivery", "Pay in cash/UPI when your order arrives")}
        ${payOption("UPI", "📱 UPI", "Pay now via UPI (demo — no real charge)")}
      </div>
    </div>
    <div class="summary">
      <h3 style="margin-bottom:10px">Order summary</h3>
      ${d.items.map(it => `<div class="row"><span>${esc(it.product_name)} × ${it.quantity}</span><b>${inr(it.line_total)}</b></div>`).join("")}
      <div class="row" style="border-top:1px solid #f1f5f9;margin-top:8px;padding-top:10px"><span>Subtotal</span><b>${inr(d.subtotal)}</b></div>
      <div class="row"><span>Delivery</span><b>${fee ? inr(fee) : '<span class="save">FREE</span>'}</b></div>
      <div class="row total"><span>Total</span><span>${inr(d.subtotal + fee)}</span></div>
      <button class="btn primary" id="btn-place" style="width:100%;margin-top:14px">Place order · ${inr(d.subtotal + fee)}</button>
      <div style="font-size:12px;color:#64748b;margin-top:8px;text-align:center">🛡️ 7-day easy returns on damaged / wrong items</div>
    </div>
  </div>`;
  $$("#pay-box .pay-option").forEach(el => el.addEventListener("click", () => {
    payMethod = el.dataset.pay;
    $$("#pay-box .pay-option").forEach(x => x.classList.toggle("sel", x === el));
    el.querySelector("input").checked = true;
  }));
  $("#btn-place").addEventListener("click", placeOrder);
}

async function placeOrder() {
  const v = (id) => $(id).value.trim();
  const body = {
    customer_name: v("#f-name"), phone: v("#f-phone"), email: v("#f-email"),
    address_line1: v("#f-addr1"), address_line2: v("#f-addr2"),
    city: v("#f-city"), state: v("#f-state"), pincode: v("#f-pin"),
    notes: v("#f-notes"), payment_method: payMethod,
    // Idempotency: one UUID per page load. Refresh/double-click sends the
    // SAME key, so the backend returns the original order instead of
    // creating a duplicate.
    idempotency_key: window.__idemKey,
  };
  const btn = $("#btn-place");
  // Double-submit guard: button stays disabled until we get a response.
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = "Placing order…";
  try {
    const order = await apiPost("/orders/checkout/", body);
    // New key for any future order from this page (e.g. user goes back).
    window.__idemKey = crypto.randomUUID();
    if (payMethod === "UPI") {
      // Online payment: NEVER trust the frontend — open Razorpay, then
      // verify the signature on the backend before marking paid.
      await payWithRazorpay(order);
    } else {
      location.href = "/order/" + order.order_number + "/";
    }
  } catch (e) {
    // 409 = prices changed mid-checkout: show what changed, refresh cart.
    if (e.status === 409 && e.data && e.data.price_changed) {
      const rows = (e.data.changes || []).map(c =>
        `<li>${esc(c.product_name)}: ₹${c.old_price} → <b>₹${c.new_price}</b></li>`
      ).join("");
      $("#co-err").innerHTML = `<div class="alert warn">
        <b>Prices updated</b> while you were checking out:
        <ul>${rows}</ul>Cart refreshed with the new prices — please review and place your order again.</div>`;
      try { renderCheckout(await api("/cart/")); } catch (_) {}
    } else {
      $("#co-err").innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
    }
    btn.disabled = false; btn.textContent = "Place order";
    window.scrollTo(0, 0);
  }
}

/* Razorpay Checkout.js flow (TEST mode). */
function loadRazorpay() {
  return new Promise((resolve, reject) => {
    if (window.Razorpay) return resolve();
    const s = document.createElement("script");
    s.src = "https://checkout.razorpay.com/v1/checkout.js";
    s.onload = resolve; s.onerror = () => reject(new Error("Could not load payment gateway"));
    document.head.appendChild(s);
  });
}

async function payWithRazorpay(order) {
  const btn = $("#btn-place");
  try {
    btn.textContent = "Opening payment…";
    const pr = await apiPost("/payments/create/", { order_number: order.order_number });
    await loadRazorpay();
    const rzp = new Razorpay({
      key: pr.key_id,
      amount: pr.amount,
      currency: pr.currency,
      name: "MarketPlace",
      description: "Order " + order.order_number,
      order_id: pr.razorpay_order_id,
      prefill: {
        name: order.customer_name, email: order.email || "",
        contact: order.phone,
      },
      theme: { color: "#4f46e5" },
      handler: async function (resp) {
        // Frontend callback is UNTRUSTED — backend verifies the signature.
        btn.textContent = "Verifying payment…";
        try {
          const vr = await apiPost("/payments/verify/", {
            order_number: order.order_number,
            razorpay_order_id: resp.razorpay_order_id,
            razorpay_payment_id: resp.razorpay_payment_id,
            razorpay_signature: resp.razorpay_signature,
          });
          if (vr.verified) location.href = "/order/" + order.order_number + "/";
        } catch (e) {
          $("#co-err").innerHTML = `<div class="alert err">Payment verification failed: ${esc(e.message)}<br>Your order ${esc(order.order_number)} is placed — payment is pending. Do not pay again; contact support if money was deducted.</div>`;
          btn.disabled = false; btn.textContent = "Place order";
        }
      },
      modal: {
        ondismiss: function () {
          // User closed without paying — order exists as PENDING, can retry.
          $("#co-err").innerHTML = `<div class="alert warn">Payment not completed. Your order <b>${esc(order.order_number)}</b> is placed with payment pending — <a href="/order/${esc(order.order_number)}/">view order</a> to retry.</div>`;
          btn.disabled = false; btn.textContent = "Place order";
          window.scrollTo(0, 0);
        },
      },
    });
    rzp.on("payment.failed", function (resp) {
      $("#co-err").innerHTML = `<div class="alert err">Payment failed: ${esc(resp.error.description || "unknown error")}<br>Your order ${esc(order.order_number)} is placed — you can retry payment from the order page.</div>`;
      btn.disabled = false; btn.textContent = "Place order";
      window.scrollTo(0, 0);
    });
    rzp.open();
  } catch (e) {
    $("#co-err").innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
    btn.disabled = false; btn.textContent = "Place order";
    window.scrollTo(0, 0);
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  // Fresh idempotency key for this checkout page load.
  window.__idemKey = crypto.randomUUID();
  try { renderCheckout(await api("/cart/")); }
  catch (e) { $("#co-wrap").innerHTML = `<div class="alert err">Could not load cart.</div>`; }
});
</script>
{% endblock %}
