{% extends "base.html" %}
{% block title %}Your cart — MarketPlace{% endblock %}
{% block content %}
<h1 style="margin-bottom:16px">🛒 Your cart</h1>
<div id="cart-wrap"><div class="loading">Loading cart…</div></div>
{% endblock %}
{% block scripts %}
<script>
function cartItemRow(it) {
  const axes = [it.color, it.size, it.storage].filter(Boolean).join(" · ");
  const img = it.image_url || "https://picsum.photos/seed/na/200/200";
  return `<div class="cart-row" data-id="${it.id}">
    <a href="/product/${it.product_slug}/"><img src="${img}" alt="${esc(it.product_name)}"></a>
    <div>
      <div style="font-size:12px;color:#64748b;text-transform:uppercase">${esc(it.brand_name || "")}</div>
      <a href="/product/${it.product_slug}/"><b>${esc(it.product_name)}</b></a>
      ${axes ? `<div style="font-size:13px;color:#64748b">${esc(axes)}</div>` : ""}
      <div style="margin:6px 0"><span class="price">${inr(it.final_price)}</span>
        ${it.discount_pct > 0 ? `<span class="mrp">${inr(it.price)}</span>` : ""}</div>
      <div class="qty-ctl">
        <button data-act="dec" aria-label="Decrease">−</button>
        <b>${it.quantity}</b>
        <button data-act="inc" aria-label="Increase">+</button>
        <button data-act="rm" style="width:auto;padding:0 10px;font-size:13px;color:#b91c1c">Remove</button>
      </div>
    </div>
    <div style="text-align:right"><b>${inr(it.line_total)}</b></div>
  </div>`;
}

async function renderCart() {
  const wrap = $("#cart-wrap");
  let d;
  try { d = await api("/cart/"); }
  catch (e) { wrap.innerHTML = `<div class="alert err">Could not load cart.</div>`; return; }
  if (!d.items.length) {
    wrap.innerHTML = `<div class="loading">Your cart is empty.<br><br><a class="btn primary" href="/">Continue shopping</a></div>`;
    return;
  }
  const fee = d.subtotal >= 499 ? 0 : 49;
  wrap.innerHTML = `<div class="checkout-grid">
    <div>${d.items.map(cartItemRow).join("")}</div>
    <div class="summary">
      <h3 style="margin-bottom:10px">Order summary</h3>
      <div class="row"><span>Subtotal (${d.item_count} items)</span><b>${inr(d.subtotal)}</b></div>
      <div class="row"><span>Delivery</span><b>${fee ? inr(fee) : '<span class="save">FREE</span>'}</b></div>
      ${fee ? `<div style="font-size:12px;color:#64748b">Add ${inr(499 - d.subtotal)} more for FREE delivery</div>` : ""}
      <div class="row total"><span>Total</span><span>${inr(d.subtotal + fee)}</span></div>
      <a class="btn primary" href="/checkout/" style="width:100%;text-align:center;margin-top:14px">Proceed to checkout</a>
      <button class="btn" id="btn-clear" style="width:100%;margin-top:8px;border:1px solid #e2e8f0;background:#fff">Clear cart</button>
    </div>
  </div>`;
  $("#btn-clear").addEventListener("click", async () => {
    if (!confirm("Clear your cart?")) return;
    await apiPost("/cart/clear/", {});
    renderCart();
  });
}

document.addEventListener("DOMContentLoaded", () => {
  renderCart();
  // Delegated qty controls
  $("#cart-wrap").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const row = btn.closest(".cart-row");
    const id = Number(row.dataset.id);
    const qtyEl = row.querySelector(".qty-ctl b");
    const qty = Number(qtyEl.textContent);
    try {
      if (btn.dataset.act === "inc") await apiPost("/cart/update/", { item_id: id, quantity: qty + 1 });
      else if (btn.dataset.act === "dec") {
        if (qty > 1) await apiPost("/cart/update/", { item_id: id, quantity: qty - 1 });
        else await apiPost("/cart/remove/", { item_id: id });
      } else if (btn.dataset.act === "rm") {
        if (!confirm("Remove this item?")) return;
        await apiPost("/cart/remove/", { item_id: id });
      }
      renderCart();
    } catch (err) { alert(err.message); }
  });
});
</script>
{% endblock %}
