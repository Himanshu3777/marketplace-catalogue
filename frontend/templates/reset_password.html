{% extends "base.html" %}
{% block title %}Reset Password — MarketPlace{% endblock %}
{% block content %}
<h1 style="margin-bottom:16px">Reset Password</h1>
<div class="form-card" style="max-width:440px">
  <div id="rp-msg"></div>
  <div id="rp-form">
    <label>New Password</label>
    <input id="rp-pass1" type="password" placeholder="New password" autocomplete="new-password">
    <label>Confirm Password</label>
    <input id="rp-pass2" type="password" placeholder="Confirm new password" autocomplete="new-password">
    <button class="btn primary" id="btn-reset" style="width:100%;margin-top:12px">Set New Password</button>
  </div>
  <p style="margin-top:12px;font-size:14px"><a href="/login/">Back to Login</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
// URL: /reset-password/<uid>/<token>/
const parts = location.pathname.split("/").filter(Boolean);
const uid = parts[1] || "";
const token = parts[2] || "";

$("#btn-reset").addEventListener("click", async () => {
  const p1 = $("#rp-pass1").value;
  const p2 = $("#rp-pass2").value;
  const box = $("#rp-msg");
  box.innerHTML = "";
  if (p1 !== p2) {
    box.innerHTML = `<div class="alert err">Passwords match nahi kar rahe.</div>`;
    return;
  }
  if (p1.length < 8) {
    box.innerHTML = `<div class="alert err">Password kam se kam 8 characters ka ho.</div>`;
    return;
  }
  const btn = $("#btn-reset");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const d = await apiPost("/accounts/reset-password/", {
      uid, token, new_password: p1,
    });
    box.innerHTML = `<div class="alert ok">${esc(d.message)}</div>`;
    $("#rp-form").style.display = "none";
  } catch (e) {
    box.innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
    btn.disabled = false; btn.textContent = "Set New Password";
  }
});
</script>
{% endblock %}
